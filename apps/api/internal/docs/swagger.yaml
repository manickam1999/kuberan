        "200":
          description: Raw attachment bytes
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "404":
          description: Attachment not found
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download a transaction attachment
      tags:
      - transactions
      - attachments
  /transactions/{id}/receivables:
    put:
      consumes:
      - application/json
      description: 'Diff the receivables of an expense: entries with an id are updated,
        entries without are inserted, omitted unpaid receivables are removed (a paid
        one returns 409).'
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: string
      - description: Receivables diff
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.UpdateReceivablesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated expense
          schema:
            $ref: '#/definitions/internal_handlers.TransactionEnvelope'
        "400":
          description: Invalid input, kind or shares
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "404":
          description: Transaction or receivable not found
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "409":
          description: Receivable has payments
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an expense's receivables
      tags:
      - receivables
  /transactions/bulk:
    post:
      consumes:
      - application/json
      description: Apply one change set (category, notes_append, shared=false) to,
        or delete, up to 200 transactions in a single database transaction. Every
        id must belong to the user (otherwise 404 TRANSACTION_NOT_FOUND and nothing
        changes); a category must match each transaction's type (400 CATEGORY_TYPE_MISMATCH);
        opening balances are rejected (400 TRANSACTION_NOT_EDITABLE). One audit row
        is written per changed transaction.
      parameters:
      - description: Ids and the changes to apply
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.BulkTransactionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Counts of updated and deleted transactions
          schema:
            $ref: '#/definitions/kuberan_internal_services.BulkTransactionResult'
        "400":
          description: Invalid input, category type mismatch or non-editable transaction
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "404":
          description: Transaction or category not found
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Bulk edit or delete transactions
      tags:
      - transactions
