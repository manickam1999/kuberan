securityDefinitions:
  ApiKeyAuth:
    description: Pipeline API key for service-to-service authentication.
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
