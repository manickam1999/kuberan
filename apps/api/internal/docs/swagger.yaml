basePath: /api/v1
definitions:
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  internal_handlers.AccountResponse:
    properties:
      balance:
        type: integer
      currency:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      type:
        $ref: '#/definitions/kuberan_internal_models.AccountType'
      user_id:
        type: integer
    type: object
  internal_handlers.AddInvestmentRequest:
    properties:
      account_id:
        type: string
      date:
        description: optional, defaults to now
        type: string
      fee:
        description: optional, defaults to 0
        maximum: 100000000000000
        minimum: 0
        type: integer
      fx_rate:
        description: 'optional decimal string: security currency -> base rate of the
          trade'
        maxLength: 32
        type: string
      notes:
        description: optional, defaults to "Initial purchase"
        maxLength: 500
        type: string
      purchase_price:
        maximum: 100000000000000
        type: integer
      quantity:
        maximum: 1000000000000000
        type: number
      security_id:
        type: string
      wallet_address:
        type: string
    required:
    - account_id
    - purchase_price
    - quantity
    - security_id
    type: object
  internal_handlers.AppearanceDefaultResponse:
    properties:
      default_palette:
        description: DefaultPalette is the server-wide palette id (DEFAULT_PALETTE).
        example: catppuccin
        type: string
    type: object
  internal_handlers.ApplyRuleRequest:
    properties:
      dry_run:
        description: default true
        type: boolean
      overwrite:
        description: only meaningful with scope=all
        type: boolean
      scope:
        description: uncategorized | all (default uncategorized)
        type: string
    type: object
  internal_handlers.AttachmentResponse:
    properties:
      attachment:
        $ref: '#/definitions/kuberan_internal_models.TransactionAttachment'
    type: object
  internal_handlers.AttachmentsResponse:
    properties:
      attachments:
        items:
          $ref: '#/definitions/kuberan_internal_models.TransactionAttachment'
        type: array
    type: object
  internal_handlers.AuthResponse:
    properties:
      access_token:
        type: string
      user:
        $ref: '#/definitions/internal_handlers.UserResponse'
    type: object
  internal_handlers.BulkTransactionSet:
    properties:
      category_id:
        type: string
      notes_append:
        maxLength: 2000
        type: string
      shared:
        description: 'Shared may only be false: it removes the receivables of the
          selected expenses.'
        type: boolean
    type: object
  internal_handlers.BulkTransactionsRequest:
    properties:
      delete:
        type: boolean
      ids:
        items:
          type: string
        maxItems: 200
        minItems: 1
        type: array
      set:
        $ref: '#/definitions/internal_handlers.BulkTransactionSet'
    required:
    - ids
    type: object
  internal_handlers.CategoryResponse:
    properties:
      color:
        type: string
      description:
        type: string
      icon:
        type: string
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: string
      type:
        $ref: '#/definitions/kuberan_internal_models.CategoryType'
      user_id:
        type: integer
    type: object
  internal_handlers.ChangePasswordRequest:
    properties:
      current_password:
        maxLength: 1024
        type: string
      new_password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  internal_handlers.CloseFixedDepositRequest:
    properties:
      destination_account_id:
        type: string
      interest_override:
        type: integer
      penalty:
        minimum: 0
        type: integer
    type: object
  internal_handlers.CompleteLinkRequest:
    properties:
      default_currency:
        type: string
      link_code:
        maxLength: 16
        minLength: 6
        type: string
      telegram_first_name:
        type: string
      telegram_user_id:
        type: integer
      telegram_username:
        type: string
    required:
    - link_code
    - telegram_user_id
    type: object
  internal_handlers.ComputeSnapshotsRequest:
    properties:
      recorded_at:
        type: string
    required:
    - recorded_at
    type: object
  internal_handlers.ConnectedAppResponse:
    properties:
      auto_accept:
        type: boolean
      client_host:
        description: |-
          ClientHost is where the app connects from (claude.ai); "" until the
          grant's next consent.
        type: string
      client_id:
        type: string
      client_name:
        type: string
      created_at:
        type: string
      last_used_at:
        type: string
      legacy:
        type: boolean
      scopes:
        items:
          type: string
        type: array
      write_limits:
        allOf:
        - $ref: '#/definitions/internal_handlers.WriteLimitsResponse'
        description: WriteLimits is set when the grant has any write:* scope.
    type: object
  internal_handlers.ConnectedAppsResponse:
    properties:
      clients:
        items:
          $ref: '#/definitions/internal_handlers.ConnectedAppResponse'
        type: array
    type: object
  internal_handlers.CounterpartiesResponse:
    properties:
      counterparties:
        items:
          $ref: '#/definitions/kuberan_internal_services.CounterpartySuggestion'
        type: array
    type: object
  internal_handlers.CreateBudgetRequest:
    properties:
      amount:
        type: integer
      category_id:
        type: string
      currency:
        description: Currency is optional (ISO 4217); it defaults to the user's base
          currency.
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      period:
        $ref: '#/definitions/kuberan_internal_models.BudgetPeriod'
    required:
    - amount
    - category_id
    - name
    - period
    type: object
  internal_handlers.CreateCashAccountRequest:
    properties:
      currency:
        type: string
      description:
        maxLength: 500
        type: string
      initial_balance:
        minimum: 0
        type: integer
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  internal_handlers.CreateCategoryRequest:
    properties:
      color:
        type: string
      description:
        maxLength: 500
        type: string
      icon:
        maxLength: 50
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      parent_id:
        type: string
      type:
        $ref: '#/definitions/kuberan_internal_models.CategoryType'
    required:
    - name
    - type
    type: object
  internal_handlers.CreateCreditCardAccountRequest:
    properties:
      credit_limit:
        minimum: 0
        type: integer
      currency:
        type: string
      current_balance:
        description: |-
          CurrentBalance is the amount already owed, in cents. When > 0 it is
          recorded as an opening_balance transaction. Currency defaults to the
          user's base currency when omitted.
        minimum: 0
        type: integer
      description:
        maxLength: 500
        type: string
      due_date:
        type: string
      due_day:
        description: |-
          DueDay (1-31) is the day of the month the statement falls due; it drives
          the Telegram reminder.
        maximum: 31
        minimum: 0
        type: integer
      interest_rate:
        maximum: 100
        minimum: 0
        type: number
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  internal_handlers.CreateDebtAccountRequest:
    properties:
      amount_owed:
        description: AmountOwed (cents) is recorded as an opening_balance row, never
          inverted.
        minimum: 0
        type: integer
      currency:
        description: Currency defaults to the user's base currency.
        type: string
      description:
        maxLength: 500
        type: string
      due_day:
        description: DueDay (1-31) is the day of the month the instalment falls due.
        maximum: 31
        minimum: 0
        type: integer
      interest_rate:
        maximum: 100
        minimum: 0
        type: number
      monthly_payment:
        minimum: 0
        type: integer
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  internal_handlers.CreateFixedDepositAccountRequest:
    properties:
      compounding:
        enum:
        - monthly
        - quarterly
        - semiannual
        - annual
        type: string
      currency:
        type: string
      description:
        maxLength: 500
        type: string
      interest_rate:
        maximum: 100
        minimum: 0
        type: number
      linked_account_id:
        type: string
      maturity_date:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      payout_frequency:
        enum:
        - monthly
        - quarterly
        - semiannual
        - annual
        type: string
      payout_type:
        enum:
        - cumulative
        - periodic
        type: string
      principal:
        type: integer
      source_account_id:
        type: string
      start_date:
        type: string
    required:
    - compounding
    - maturity_date
    - name
    - payout_type
    - principal
    - source_account_id
    - start_date
    type: object
  internal_handlers.CreateInvestmentAccountRequest:
    properties:
      account_number:
        maxLength: 50
        type: string
      broker:
        maxLength: 100
        type: string
      currency:
        type: string
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  internal_handlers.CreateRuleRequest:
    properties:
      actions:
        items:
          $ref: '#/definitions/internal_handlers.RuleActionDTO'
        minItems: 1
        type: array
      conditions:
        items:
          $ref: '#/definitions/internal_handlers.RuleConditionDTO'
        minItems: 1
        type: array
      is_active:
        type: boolean
      name:
        maxLength: 120
        minLength: 1
        type: string
      priority:
        type: integer
    required:
    - actions
    - conditions
    - name
    type: object
  internal_handlers.CreateSecurityRequest:
    properties:
      asset_type:
        $ref: '#/definitions/kuberan_internal_models.AssetType'
      coupon_rate:
        type: number
      currency:
        type: string
      exchange:
        type: string
      maturity_date:
        type: string
      name:
        maxLength: 200
        minLength: 1
        type: string
      network:
        type: string
      property_type:
        type: string
      provider_symbol:
        type: string
      symbol:
        maxLength: 20
        minLength: 1
        type: string
      yield_to_maturity:
        type: number
    required:
    - asset_type
    - name
    - symbol
    type: object
  internal_handlers.CreateSharedExpenseRequest:
    properties:
      account_id:
        type: string
      amount:
        type: integer
      category_id:
        type: string
      counterparties:
        items:
          $ref: '#/definitions/internal_handlers.SharedCounterpartyRequest'
        type: array
      date:
        type: string
      description:
        maxLength: 500
        type: string
      kind:
        $ref: '#/definitions/kuberan_internal_models.ReceivableKind'
      mode:
        allOf:
        - $ref: '#/definitions/kuberan_internal_services.ShareMode'
        enum:
        - equal
        - custom
        - full
      notes:
        maxLength: 2000
        type: string
    required:
    - account_id
    - amount
    - kind
    - mode
    type: object
  internal_handlers.CreateTransactionRequest:
    properties:
      account_id:
        type: string
      amount:
        type: integer
      category_id:
        type: string
      date:
        type: string
      description:
        maxLength: 500
        type: string
      notes:
        maxLength: 2000
        type: string
      type:
        $ref: '#/definitions/kuberan_internal_models.TransactionType'
    required:
    - account_id
    - amount
    - type
    type: object
  internal_handlers.CreateTransferRequest:
    properties:
      amount:
        type: integer
      date:
        type: string
      description:
        maxLength: 500
        type: string
      from_account_id:
        type: string
      notes:
        maxLength: 2000
        type: string
      to_account_id:
        type: string
      to_amount:
        description: |-
          ToAmount is the amount arriving in the destination account, in its
          currency. Required when the two accounts' currencies differ.
        type: integer
    required:
    - amount
    - from_account_id
    - to_account_id
    type: object
  internal_handlers.ErrorDetail:
    properties:
      code:
        type: string
      details:
        additionalProperties: {}
        description: machine-readable context, e.g. FX_AMOUNT_REQUIRED's suggested_amount
        type: object
      message:
        type: string
    type: object
  internal_handlers.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/internal_handlers.ErrorDetail'
    type: object
  internal_handlers.FXLatestResponse:
    properties:
      base:
        type: string
      path:
        enum:
        - identity
        - direct
        - inverse
        - pivot:USD
        type: string
      quote:
        type: string
      rate:
        example: "4.4712"
        type: string
      recorded_at:
        type: string
      stale:
        type: boolean
    type: object
  internal_handlers.FXPairResponse:
    properties:
      base:
        type: string
      quote:
        type: string
    type: object
  internal_handlers.FXPairsResponse:
    properties:
      base_currencies:
        items:
          type: string
        type: array
      pairs:
        items:
          $ref: '#/definitions/internal_handlers.FXPairResponse'
        type: array
    type: object
  internal_handlers.FXRateEntry:
    properties:
      base:
        type: string
      quote:
        type: string
      rate:
        type: string
      recorded_at:
        type: string
      source:
        maxLength: 32
        type: string
    required:
    - base
    - quote
    - rate
    - recorded_at
    type: object
  internal_handlers.FXRateHistoryResponse:
    properties:
      base:
        type: string
      quote:
        type: string
      rates:
        items:
          $ref: '#/definitions/internal_handlers.FXRatePoint'
        type: array
    type: object
  internal_handlers.FXRatePoint:
    properties:
      rate:
        example: "4.4712"
        type: string
      recorded_at:
        type: string
    type: object
  internal_handlers.LoginRequest:
    properties:
      email:
        maxLength: 254
        type: string
      password:
        maxLength: 1024
        type: string
    required:
    - email
    - password
    type: object
  internal_handlers.MessageResponse:
    properties:
      message:
        type: string
    type: object
  internal_handlers.PreviewRuleRequest:
    properties:
      conditions:
        items:
          $ref: '#/definitions/internal_handlers.RuleConditionDTO'
        minItems: 1
        type: array
    required:
    - conditions
    type: object
  internal_handlers.ProcessFixedDepositsRequest:
    properties:
      as_of:
        type: string
    type: object
  internal_handlers.ReceivableEnvelope:
    properties:
      receivable:
        $ref: '#/definitions/kuberan_internal_models.Receivable'
    type: object
  internal_handlers.ReceivableShareRequest:
    properties:
      amount:
        type: integer
      id:
        type: string
      name:
        type: string
    type: object
  internal_handlers.RecordBuyRequest:
    properties:
      date:
        type: string
      fee:
        maximum: 100000000000000
        minimum: 0
        type: integer
      funding_account_id:
        type: string
      funding_amount:
        description: |-
          FundingAmount is the amount debited from the funding account in ITS currency;
          required when that differs from the security's currency.
        maximum: 100000000000000
        type: integer
      fx_rate:
        description: FXRate optionally overrides the security currency -> base rate
          (decimal string).
        maxLength: 32
        type: string
      notes:
        maxLength: 500
        type: string
      price_per_unit:
        maximum: 100000000000000
        type: integer
      quantity:
        maximum: 1000000000000000
        type: number
    required:
    - date
    - price_per_unit
    - quantity
    type: object
  internal_handlers.RecordDividendRequest:
    properties:
      amount:
        description: gross, in the security's currency
        maximum: 100000000000000
        type: integer
      date:
        type: string
      deposit_account_id:
        description: DepositAccountID optionally credits the NET dividend (amount
          - fee) to a cash account.
        type: string
      deposit_amount:
        description: |-
          DepositAmount is the net amount credited in the deposit account's currency;
          required when that differs from the security's currency.
        maximum: 100000000000000
        type: integer
      dividend_type:
        maxLength: 50
        type: string
      fee:
        description: Fee is withholding tax plus dividend fees, in the security's
          currency (<= amount).
        maximum: 100000000000000
        minimum: 0
        type: integer
      fx_rate:
        description: FXRate optionally overrides the security currency -> base rate
          (decimal string).
        maxLength: 32
        type: string
      notes:
        maxLength: 500
        type: string
    required:
    - amount
    - date
    type: object
  internal_handlers.RecordFXRatesRequest:
    properties:
      rates:
        items:
          $ref: '#/definitions/internal_handlers.FXRateEntry'
        maxItems: 5000
        minItems: 1
        type: array
    required:
    - rates
    type: object
  internal_handlers.RecordPriceEntry:
    properties:
      currency:
        description: |-
          Currency is required per entry. It is validated by the service so a missing
          one rejects only that entry (reason currency_required), as does a value that
          differs from the security's currency (currency_mismatch).
        type: string
      price:
        type: integer
      recorded_at:
        type: string
      security_id:
        type: string
    required:
    - price
    - recorded_at
    - security_id
    type: object
  internal_handlers.RecordPricesRequest:
    properties:
      prices:
        items:
          $ref: '#/definitions/internal_handlers.RecordPriceEntry'
        maxItems: 5000
        minItems: 1
        type: array
    required:
    - prices
    type: object
  internal_handlers.RecordPricesResponse:
    properties:
      prices_recorded:
        type: integer
      recorded:
        type: integer
      rejected:
        items:
          $ref: '#/definitions/kuberan_internal_services.RejectedPrice'
        type: array
    type: object
  internal_handlers.RecordSellRequest:
    properties:
      date:
        type: string
      deposit_account_id:
        type: string
      deposit_amount:
        description: |-
          DepositAmount is the amount credited to the deposit account in ITS currency;
          required when that differs from the security's currency.
        maximum: 100000000000000
        type: integer
      fee:
        maximum: 100000000000000
        minimum: 0
        type: integer
      fx_rate:
        description: FXRate optionally overrides the security currency -> base rate
          (decimal string).
        maxLength: 32
        type: string
      notes:
        maxLength: 500
        type: string
      price_per_unit:
        maximum: 100000000000000
        type: integer
      quantity:
        maximum: 1000000000000000
        type: number
    required:
    - date
    - price_per_unit
    - quantity
    type: object
  internal_handlers.RecordSplitRequest:
    properties:
      date:
        type: string
      notes:
        maxLength: 500
        type: string
      split_ratio:
        maximum: 1000000
        type: number
    required:
    - date
    - split_ratio
    type: object
  internal_handlers.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  internal_handlers.RegisterRequest:
    properties:
      base_currency:
        description: |-
          BaseCurrency is the optional reporting currency (ISO 4217, 2-decimal,
          same rule as PATCH /profile). Omitted keeps the default (MYR).
        example: EUR
        type: string
      email:
        maxLength: 254
        type: string
      first_name:
        maxLength: 100
        type: string
      last_name:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  internal_handlers.RenameCounterpartyRequest:
    properties:
      from_key:
        type: string
      to_name:
        type: string
    required:
    - from_key
    - to_name
    type: object
  internal_handlers.RenameCounterpartyResponse:
    properties:
      updated:
        type: integer
    type: object
  internal_handlers.ReorderRulesRequest:
    properties:
      rule_ids:
        items:
          type: string
        type: array
    required:
    - rule_ids
    type: object
  internal_handlers.RevokedSessionsResponse:
    properties:
      revoked_sessions:
        type: integer
    type: object
  internal_handlers.RuleActionDTO:
    properties:
      action_type:
        type: string
      category_id:
        type: string
      value_text:
        type: string
    required:
    - action_type
    type: object
  internal_handlers.RuleConditionDTO:
    properties:
      amount_max:
        type: integer
      amount_min:
        type: integer
      field:
        type: string
      operator:
        type: string
      value_text:
        type: string
    required:
    - field
    - operator
    type: object
  internal_handlers.SessionResponse:
    properties:
      created_at:
        type: string
      current:
        description: Current is true for the session the request's access token belongs
          to.
        type: boolean
      id:
        type: string
      ip_address:
        type: string
      last_seen_at:
        description: LastSeenAt is the last token rotation, or CreatedAt before the
          first.
        type: string
      user_agent:
        type: string
    type: object
  internal_handlers.SetReminderEnabledRequest:
    properties:
      enabled:
        type: boolean
    required:
    - enabled
    type: object
  internal_handlers.SettleReceivableRequest:
    properties:
      account_amount:
        description: |-
          AccountAmount is the amount credited to the account, in the account's
          currency. Required when it differs from the receivable's currency.
        type: integer
      account_id:
        type: string
      amount:
        type: integer
      date:
        type: string
      description:
        maxLength: 500
        type: string
      write_off_remainder:
        type: boolean
    required:
    - account_id
    - amount
    type: object
  internal_handlers.SettleResponse:
    properties:
      receivable:
        $ref: '#/definitions/kuberan_internal_models.Receivable'
      settlement:
        $ref: '#/definitions/kuberan_internal_models.ReceivableSettlement'
    type: object
  internal_handlers.SharedCounterpartyRequest:
    properties:
      amount:
        type: integer
      name:
        type: string
    type: object
  internal_handlers.SystemStatusResponse:
    properties:
      demo_enabled:
        type: boolean
      demo_loaded:
        type: boolean
      last_backup_at:
        type: string
      latest_fx_rate_at:
        type: string
      latest_price_at:
        type: string
      latest_snapshot_at:
        type: string
    type: object
  internal_handlers.TransactionEnvelope:
    properties:
      transaction:
        $ref: '#/definitions/kuberan_internal_models.Transaction'
    type: object
  internal_handlers.TransactionResponse:
    properties:
      account_id:
        type: string
      amount:
        type: integer
      category_id:
        type: string
      date:
        type: string
      description:
        type: string
      id:
        type: integer
      type:
        $ref: '#/definitions/kuberan_internal_models.TransactionType'
      user_id:
        type: integer
    type: object
  internal_handlers.UpdateAccountRequest:
    properties:
      account_number:
        maxLength: 50
        type: string
      broker:
        maxLength: 100
        type: string
      compounding:
        enum:
        - monthly
        - quarterly
        - semiannual
        - annual
        type: string
      credit_limit:
        minimum: 0
        type: integer
      description:
        maxLength: 500
        type: string
      due_date:
        type: string
      due_day:
        description: DueDay (1-31) for credit cards and loans; 0 clears it.
        maximum: 31
        minimum: 0
        type: integer
      interest_rate:
        maximum: 100
