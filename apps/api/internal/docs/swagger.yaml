      ignored_sections:
        description: IgnoredSections lists the statement sections that are deliberately
          not imported.
        items:
          type: string
        type: array
      periods:
        description: Periods are the statement periods in chronological order.
        items:
          $ref: '#/definitions/kuberan_internal_services.IBKRImportPeriod'
        type: array
      securities:
        description: Securities has one entry per symbol with holdings activity.
        items:
          $ref: '#/definitions/kuberan_internal_services.IBKRImportSecurity'
        type: array
      warnings:
        description: Warnings never block an apply.
        items:
          type: string
        type: array
    type: object
  kuberan_internal_services.IBKRImportSecurity:
    properties:
      checkpoints:
        items:
          $ref: '#/definitions/kuberan_internal_services.IBKRImportCheckpoint'
        type: array
      existing_transactions:
        type: integer
      final:
        allOf:
        - $ref: '#/definitions/kuberan_internal_services.IBKRImportFinal'
        description: Final is the holding after replaying all events.
      investment_id:
        description: InvestmentID is null when the investment will be created on apply.
        type: string
      new_transactions:
        type: integer
      security_id:
        type: string
      symbol:
        type: string
    type: object
  kuberan_internal_services.IBKRImportUnmatched:
    properties:
      amount:
        type: integer
      candidates:
        description: |-
          Candidates are the legacy transfers that were within 5 days but rejected
          (implied rate too far from the market rate), to help manual pairing.
        items:
          $ref: '#/definitions/kuberan_internal_services.IBKRImportCandidate'
        type: array
      date:
        type: string
      detail:
        type: string
      kind:
        type: string
    type: object
  kuberan_internal_services.PortfolioSummary:
    properties:
      currency:
        description: |-
          Currency is the user's base currency, which every value above is in
          (cost basis and realized gain/loss are the frozen base-currency figures).
        type: string
      fx_stale:
        description: FXStale is true when any FX quote used was stale.
        type: boolean
      gain_loss_pct:
        type: number
      holdings_by_type:
        additionalProperties:
          $ref: '#/definitions/kuberan_internal_services.TypeSummary'
        type: object
      total_cost_basis:
        type: integer
      total_fx_return:
        type: integer
      total_gain_loss:
        type: integer
      total_price_return:
        description: |-
          TotalPriceReturn and TotalFXReturn split the unrealized gain
          (TotalValue - TotalCostBasis): the native gain at today's rate, and the
          currency effect on the cost. They sum to TotalGainLoss within a cent per holding.
        type: integer
      total_realized_gain_loss:
        type: integer
      total_value:
        type: integer
      unconverted:
        description: |-
          Unconverted lists holdings that could not be valued for lack of an FX
          rate, as native value summed per currency. They are left out of the totals.
        items:
          $ref: '#/definitions/kuberan_internal_services.UnconvertedValue'
        type: array
    type: object
  kuberan_internal_services.ReceivableCounterpartyTotal:
    properties:
      counterparty_key:
        type: string
      counterparty_name:
        type: string
      oldest_date:
        description: date of the oldest open expense
        type: string
      open_count:
        type: integer
      outstanding:
        description: cents
        type: integer
    type: object
  kuberan_internal_services.ReceivableCurrencyTotal:
    properties:
      currency:
        type: string
      outstanding:
        description: cents of Currency
        type: integer
    type: object
  kuberan_internal_services.ReceivableKindTotal:
    properties:
      kind:
        $ref: '#/definitions/kuberan_internal_models.ReceivableKind'
      open_count:
        type: integer
      outstanding:
        description: cents
        type: integer
    type: object
  kuberan_internal_services.ReceivableSummary:
    properties:
      by_counterparty:
        items:
          $ref: '#/definitions/kuberan_internal_services.ReceivableCounterpartyTotal'
        type: array
      by_currency:
        description: native outstanding per receivable currency
        items:
          $ref: '#/definitions/kuberan_internal_services.ReceivableCurrencyTotal'
        type: array
      by_kind:
        items:
          $ref: '#/definitions/kuberan_internal_services.ReceivableKindTotal'
        type: array
      currency:
        description: currency of the converted totals (base)
        type: string
      fx_missing:
        description: some outstanding amounts had no rate and are left out
        type: boolean
      total_outstanding:
        description: cents, in Currency (the user's base)
        type: integer
    type: object
  kuberan_internal_services.RejectedPrice:
    properties:
      currency:
        type: string
      expected_currency:
        type: string
      index:
        type: integer
      reason:
        type: string
      security_id:
        type: string
    type: object
  kuberan_internal_services.RuleMatchPreview:
    properties:
      count:
        type: integer
      sample:
        items:
          $ref: '#/definitions/kuberan_internal_models.Transaction'
        type: array
    type: object
  kuberan_internal_services.RuleSuggestion:
    properties:
      category_id:
        type: string
      count:
        type: integer
      description_pattern:
        type: string
      type:
        $ref: '#/definitions/kuberan_internal_models.TransactionType'
    type: object
  kuberan_internal_services.ShareMode:
    enum:
    - equal
    - custom
    - full
    type: string
    x-enum-varnames:
    - ShareModeEqual
    - ShareModeCustom
    - ShareModeFull
  kuberan_internal_services.SpendingByCategory:
    properties:
      currency:
        description: Currency is the currency of every amount (the user's base currency).
        type: string
      from_date:
        type: string
      fx_missing:
        description: FXMissing is true when some spending had no exchange rate and
          was left out.
        type: boolean
      items:
        items:
          $ref: '#/definitions/kuberan_internal_services.SpendingByCategoryItem'
        type: array
      to_date:
        type: string
      total_spent:
        type: integer
      unconverted:
        description: Unconverted lists, per currency, the native amounts left out
          of the totals.
        items:
          $ref: '#/definitions/kuberan_internal_services.UnconvertedAmount'
        type: array
    type: object
  kuberan_internal_services.SpendingByCategoryItem:
    properties:
      category_color:
        type: string
      category_icon:
        type: string
      category_id:
        type: string
      category_name:
        type: string
      total:
        type: integer
    type: object
  kuberan_internal_services.TopExpenseItem:
    properties:
      account_id:
        type: string
      account_name:
        type: string
      amount:
        description: cents, the full amount that left the account
        type: integer
      amount_base:
        description: |-
          AmountBase is the effective amount (personal share, else Amount) converted
          to the user's base currency at the expense's date; 0 when FXMissing.
        type: integer
      category_color:
        type: string
      category_icon:
        type: string
      category_id:
        type: string
      category_name:
        type: string
      currency:
        description: Currency is the account's currency, the unit of Amount and PersonalAmount.
        type: string
      date:
        type: string
      description:
        type: string
      fx_missing:
        description: FXMissing is true when no rate existed, so AmountBase could not
          be computed.
        type: boolean
      id:
        type: string
      personal_amount:
        description: cents, the user's own share; nil when not shared
        type: integer
    type: object
  kuberan_internal_services.TopExpenses:
    properties:
      currency:
        description: Currency is the user's base currency (the unit of each AmountBase).
        type: string
      from_date:
        type: string
      fx_missing:
        description: |-
          FXMissing is true when some matching expenses had no rate; they rank after
          every converted expense.
        type: boolean
      items:
        items:
          $ref: '#/definitions/kuberan_internal_services.TopExpenseItem'
        type: array
      to_date:
        type: string
      total_count:
        description: |-
          TotalCount is the number of expenses with a non-zero effective amount in
          the range (ignoring the limit), for count and average statistics.
        type: integer
    type: object
  kuberan_internal_services.TypeSummary:
    properties:
      count:
        type: integer
      value:
        type: integer
    type: object
  kuberan_internal_services.Typical:
    properties:
      avg_income:
        description: AvgIncome and AvgSpending are per-month averages.
        type: integer
      avg_spending:
        type: integer
      by_category:
        description: ByCategory is the average monthly spending per category, largest
          first.
        items:
          $ref: '#/definitions/kuberan_internal_services.SpendingByCategoryItem'
        type: array
      currency:
        type: string
      daily_cumulative:
        description: |-
          DailyCumulative is the average cumulative spending after day 1..31 of a
          month (always 31 points; a shorter month holds its total after its last
          day).
        items:
          type: integer
        type: array
      fx_missing:
        description: FXMissing is true when some amounts had no exchange rate and
          were left out.
        type: boolean
      months:
        description: Months is the number of months asked for.
        type: integer
      months_used:
        description: |-
          MonthsUsed is how many of them the averages cover: the months from the
          user's first income or expense in the window, so a new user is not
          averaged against empty months. 0 means there is no history yet and
          every figure is zero.
        type: integer
      saved_percent:
        description: |-
          SavedPercent is (income - spending) / income over the window, in
          percent with one decimal; 0 when there was no income.
        type: number
      unconverted:
        items:
          $ref: '#/definitions/kuberan_internal_services.UnconvertedAmount'
        type: array
    type: object
  kuberan_internal_services.UnconvertedAmount:
    properties:
      amount:
        description: minor units, in Currency
        type: integer
      currency:
        type: string
    type: object
  kuberan_internal_services.UnconvertedValue:
    properties:
      currency:
        type: string
      value:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Kuberan is a personal finance application that allows users to efficiently
    manage their finances, make budgets, and track investments.
  termsOfService: http://swagger.io/terms/
  title: Kuberan API
  version: "1.0"
paths:
  /accounts:
    get:
      consumes:
      - application/json
      description: Get a paginated list of accounts for the authenticated user
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      - description: Also list deactivated accounts
        in: query
        name: include_inactive
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Paginated accounts
          schema:
            $ref: '#/definitions/kuberan_internal_pagination.PageResponse-kuberan_internal_models_Account'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user accounts
      tags:
      - accounts
  /accounts/{id}:
    get:
      consumes:
      - application/json
      description: Get a specific account by ID for the authenticated user
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Account details
          schema:
            $ref: '#/definitions/internal_handlers.AccountResponse'
        "400":
          description: Invalid account ID
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get account by ID
      tags:
      - accounts
    put:
      consumes:
      - application/json
      description: Update an existing account for the authenticated user. Accepts
        common fields for all account types and type-specific fields.
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated account details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.UpdateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated account
          schema:
            $ref: '#/definitions/internal_handlers.AccountResponse'
        "400":
          description: Invalid input or account ID
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update account
      tags:
      - accounts
  /accounts/{id}/balance-history:
    get:
      description: Daily balances of one account in the account's own currency, one
        point per recorded UTC day (written by the snapshot pipeline). from defaults
        to 90 days before to, to defaults to today; at most 3700 days.
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Start date (RFC3339 or YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: End date (RFC3339 or YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Balance history
          schema:
            additionalProperties:
              $ref: '#/definitions/kuberan_internal_services.AccountBalanceHistory'
            type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get account balance history
      tags:
      - accounts
  /accounts/{id}/fixed-deposit/close:
    post:
      consumes:
      - application/json
      description: 'Realize a fixed deposit: return principal to the destination account
        and post interest income. Handles both maturity realization and premature
        withdrawal.'
      parameters:
      - description: Fixed deposit account ID
        in: path
        name: id
        required: true
        type: string
      - description: Close parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.CloseFixedDepositRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Closed account
          schema:
            $ref: '#/definitions/internal_handlers.AccountResponse'
        "400":
          description: Invalid input or deposit state
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "409":
          description: Deposit already closed
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Close a fixed deposit
      tags:
      - accounts
  /accounts/{id}/investments:
    get:
      consumes:
      - application/json
      description: Get a paginated list of investments for an account
      parameters:
      - description: Account ID
        in: path
        name: id
        type: integer
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated investments
          schema:
            $ref: '#/definitions/kuberan_internal_pagination.PageResponse-kuberan_internal_models_Investment'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get account investments
      tags:
      - investments
  /accounts/{id}/transactions:
    get:
      consumes:
      - application/json
      description: Get a paginated list of transactions for a specific account with
        optional filters
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: integer
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      - description: Filter by start date (RFC3339 e.g. 2024-01-01T00:00:00Z, or YYYY-MM-DD)
        in: query
        name: from_date
        type: string
      - description: Filter by end date (RFC3339 or YYYY-MM-DD)
        in: query
        name: to_date
        type: string
      - description: Filter by transaction type (income, expense, transfer, investment)
        in: query
        name: type
        type: string
      - description: Filter by category ID
        in: query
        name: category_id
        type: integer
      - description: Filter by minimum amount (cents)
        in: query
        name: min_amount
        type: integer
      - description: Filter by maximum amount (cents)
        in: query
        name: max_amount
        type: integer
      - description: Search description and notes (case-insensitive, max 100 chars);
          a numeric value such as 64.73 also matches the amount
        in: query
        name: q
        type: string
      - description: true keeps only transactions with receivables, false only those
          without
        in: query
        name: shared
        type: boolean
      - description: true keeps only transactions with receipts, false only those
          without
        in: query
        name: has_attachment
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Paginated transactions
          schema:
            $ref: '#/definitions/kuberan_internal_pagination.PageResponse-kuberan_internal_models_Transaction'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get account transactions
      tags:
      - accounts
      - transactions
  /accounts/cash:
    post:
      consumes:
      - application/json
      description: Create a new cash account for the authenticated user
      parameters:
      - description: Cash account details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.CreateCashAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Account created
          schema:
            $ref: '#/definitions/internal_handlers.AccountResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a cash account
      tags:
      - accounts
  /accounts/credit-card:
    post:
      consumes:
      - application/json
      description: Create a new credit card account for the authenticated user
      parameters:
      - description: Credit card account details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.CreateCreditCardAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Account created
          schema:
            $ref: '#/definitions/internal_handlers.AccountResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a credit card account
      tags:
      - accounts
  /accounts/debt:
    post:
      consumes:
      - application/json
      description: Create a loan (debt) account. The amount owed is recorded as an
        opening balance in one transaction.
      parameters:
      - description: Loan details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.CreateDebtAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Account created
          schema:
            $ref: '#/definitions/internal_handlers.AccountResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a loan account
      tags:
      - accounts
  /accounts/fixed-deposit:
    post:
      consumes:
      - application/json
      description: Open a new fixed deposit account. Principal is transferred from
        the specified source cash account atomically.
      parameters:
      - description: Fixed deposit account details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.CreateFixedDepositAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Account created
          schema:
            $ref: '#/definitions/internal_handlers.AccountResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a fixed deposit account
      tags:
      - accounts
  /accounts/investment:
    post:
      consumes:
      - application/json
      description: Create a new investment account for the authenticated user
      parameters:
      - description: Investment account details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.CreateInvestmentAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Account created
          schema:
            $ref: '#/definitions/internal_handlers.AccountResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an investment account
      tags:
      - accounts
  /accounts/sparklines:
    get:
      description: Daily balances over the last N days (default 30, 2 to 365) for
        each of the user's active accounts, in each account's own currency. Accounts
        with no recorded history have an empty points list.
      parameters:
      - description: Number of days (default 30, min 2, max 365)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Sparklines
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/kuberan_internal_services.AccountSparkline'
              type: array
