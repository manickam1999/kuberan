      is_active:
        type: boolean
      last_matched_at:
        type: string
      match_count:
        description: |-
          MatchCount is how many transactions this rule has categorized (new
          transactions it matched plus rows a backfill changed); LastMatchedAt is
          when that last happened (nil if never).
        type: integer
      name:
        type: string
      priority:
        description: lower = evaluated first
        type: integer
      updated_at:
        type: string
      user_id:
        type: string
    type: object
