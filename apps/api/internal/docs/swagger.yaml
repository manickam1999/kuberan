  /imports/csv:
    post:
      consumes:
      - multipart/form-data
      description: Upload one CSV (at most 5,000 data rows) with a header row. A dry
        run (default) returns the detected columns, a sample, the suggested mapping
        and, when a mapping is sent, what would be created or skipped; apply=true
        writes the new rows in one transaction with source "import". Rows repeating
        an earlier import (same import_ref) and rows matching an entry typed by hand
        are skipped; the user's rules categorise the rest. Amounts are in the target
        account's currency. The file is processed in memory only.
      parameters:
      - description: The CSV file (UTF-8)
        in: formData
        name: file
        required: true
        type: file
      - description: Cash, credit-card or debt account the rows go into
        in: formData
        name: account_id
        required: true
        type: string
      - description: Header of the date column (starts the mapping)
        in: formData
        name: date_column
        type: string
      - description: Header of the description column
        in: formData
        name: description_column
        type: string
      - description: Header of a signed amount column (or use debit_column and credit_column)
        in: formData
        name: amount_column
        type: string
      - description: Header of the money-out column
        in: formData
        name: debit_column
        type: string
      - description: Header of the money-in column
        in: formData
        name: credit_column
        type: string
      - description: Header of a category column (matched to your categories by name)
        in: formData
        name: category_column
        type: string
      - description: Header of a notes column
        in: formData
        name: notes_column
        type: string
      - description: 'e.g. DD/MM/YYYY (default: the suggested format)'
        in: formData
        name: date_format
        type: string
      - description: '''.'' or '','' (default: the suggested one)'
        in: formData
        name: decimal_separator
        type: string
      - description: negative_is_expense (default) or positive_is_expense
        in: formData
        name: amount_sign
        type: string
      - description: 'Write the changes (default: dry run; needs a mapping)'
        in: formData
        name: apply
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kuberan_internal_services.CSVImportReport'
        "400":
          description: Invalid input, CSV_TOO_MANY_ROWS or IMPORT_INVALID
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "409":
          description: Another import is being applied
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "413":
          description: File too large
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Import a bank-statement CSV
      tags:
      - imports
  /imports/ibkr:
    post:
      consumes:
      - multipart/form-data
      description: Upload 1-10 contiguous Activity Statement CSVs. A dry run (default)
        returns the report without writing; apply=true writes the holdings and the
        cash ledger in one transaction and is refused (400 IMPORT_INVALID, report
        in details) when the report has errors or a quantity checkpoint fails. Uploads
        are processed in memory only.
      parameters:
      - description: Activity Statement CSVs (1-10)
        in: formData
        name: files
        required: true
        type: file
      - description: Investment account of the holdings
        in: formData
        name: investment_account_id
        required: true
        type: string
      - description: Cash account (statement base currency) for the cash ledger
        in: formData
        name: cash_account_id
        required: true
        type: string
      - description: YYYY-MM-DD; cash legs start on this date
        in: formData
        name: cash_start_date
        required: true
        type: string
      - description: Old IBKR cash account whose incoming transfers are re-pointed
        in: formData
        name: legacy_cash_account_id
        type: string
      - description: Deactivate the legacy account after apply
        in: formData
        name: deactivate_legacy_cash_account
        type: boolean
      - description: 'Write the changes (default: dry run)'
        in: formData
        name: apply
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kuberan_internal_services.IBKRImportReport'
        "400":
          description: Invalid input or IMPORT_INVALID
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "409":
          description: Another import is being applied
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "413":
          description: File too large
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Import IBKR Activity Statements
      tags:
      - imports
