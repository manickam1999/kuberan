  kuberan_internal_models.Transaction:
    properties:
      account:
        allOf:
        - $ref: '#/definitions/kuberan_internal_models.Account'
        description: Relationships
      account_id:
        type: string
      amount:
        type: integer
      attachments:
        description: |-
          Attachments are receipt images/PDFs. Preloaded only on detail queries
          (not on list). See plans/017-transaction-receipts.
        items:
          $ref: '#/definitions/kuberan_internal_models.TransactionAttachment'
        type: array
      attachments_count:
        description: |-
          AttachmentsCount is a derived (non-persisted) count of receipts, populated
          on list queries so the UI can show a paperclip indicator without loading
          the attachment rows. See plans/017-transaction-receipts.
        type: integer
      category:
        $ref: '#/definitions/kuberan_internal_models.Category'
      category_id:
        type: string
      created_at:
        type: string
      date:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        type: string
      id:
        type: string
      implied_rate:
        description: |-
          ImpliedRate is the response-only rate to_amount/amount (decimal string,
          10 dp, half-even), set for cross-currency transfers.
        type: string
      import_ref:
        description: |-
          ImportRef marks a row written by an importer ("ibkr:<account>:<event key>")
          so that re-running the import replaces rather than duplicates it. NULL for
          every row that was entered by hand.
        type: string
      notes:
        description: Notes is free text the user attaches to the row (max 2000 characters).
        type: string
      personal_amount:
        description: |-
          PersonalAmount is the user's own share of an expense, in cents. NULL means
          the whole Amount is theirs. It is server-maintained (plan 021, D6) and is
          always serialized (null when unset). Reports aggregate
          COALESCE(personal_amount, amount).
        type: integer
      receivables:
        description: |-
          Receivables are the amounts owed back to the user for a shared expense.
          Preloaded on list and detail queries for expenses (plan 021).
        items:
          $ref: '#/definitions/kuberan_internal_models.Receivable'
        type: array
      source:
        allOf:
        - $ref: '#/definitions/kuberan_internal_models.TransactionSource'
        description: Source is where the row came from, one of the TransactionSource
          values.
      source_client_id:
        description: |-
          SourceClientID is the OAuth client that wrote the row when Source is
          "mcp". NULL otherwise.
        type: string
      source_client_name:
        description: |-
          SourceClientName is the response-only display name of SourceClientID's
          app, taken from the user's grant ("an app" once the grant is gone).
        type: string
      to_account:
        $ref: '#/definitions/kuberan_internal_models.Account'
      to_account_id:
        description: For transfers
        type: string
      to_amount:
        description: |-
          ToAmount is the amount credited to the destination account, in the
          destination's currency, for a cross-currency transfer. NULL means the
          destination receives Amount. Use EffectiveToAmount to read it.
        type: integer
      type:
        $ref: '#/definitions/kuberan_internal_models.TransactionType'
      updated_at:
        type: string
      user_id:
        type: string
    type: object
