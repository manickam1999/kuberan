  /investments/{id}/buy:
    post:
      consumes:
      - application/json
      description: 'Record a buy transaction for an investment holding. Price, fee
        and total are in the security''s currency. With funding_account_id the cost
        is debited from that cash account; when its currency differs from the security''s,
        funding_amount (in the account''s currency) is required (400 FX_AMOUNT_REQUIRED,
        with details.suggested_amount from the market rate). The trade''s FX rate
        to the base currency is, in order: fx_rate, the rate implied by a base-currency
        funding account, 1 for a base-currency security, the market rate (503 FX_RATE_UNAVAILABLE
        if none; pass fx_rate).'
      parameters:
      - description: Investment ID
        in: path
        name: id
        required: true
        type: integer
      - description: Buy details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.RecordBuyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Transaction created
          schema:
            $ref: '#/definitions/kuberan_internal_models.InvestmentTransaction'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "404":
          description: Investment not found
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "503":
          description: No FX rate available; pass fx_rate
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Record buy transaction
      tags:
      - investments
  /investments/{id}/dividend:
    post:
      consumes:
      - application/json
      description: Record a dividend for an investment holding. amount is the gross
        dividend and fee the withholding tax and fees, in the security's currency.
        With deposit_account_id the net (amount - fee) is credited to that cash account;
        when its currency differs from the security's, deposit_amount (the net, in
        the account's currency) is required (400 FX_AMOUNT_REQUIRED). fx_rate overrides
        the trade's FX rate as for buys.
      parameters:
