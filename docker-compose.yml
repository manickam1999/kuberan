version: "3"

services:
  api:
    build:
      context: ./apps/api
      dockerfile: dockerfiles/Dockerfile.dev
    volumes:
      - ./apps/api:/app
      - go-modules:/go/pkg/mod
    ports:
      - "8080:8080"
    environment:
      - ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=kuberan
      - DB_PASSWORD=kuberan
      - DB_NAME=kuberan
      - DB_SSLMODE=disable
      # JWT_SECRET signs the api's own access/refresh/bot tokens (HS256).
      # The mcp server no longer needs it: it validates Hydra-issued JWTs via JWKS.
      - JWT_SECRET=${JWT_SECRET:-fallback-secret-key-for-dev-only}
      - PIPELINE_API_KEY=${PIPELINE_API_KEY}
      - BOT_INTERNAL_SECRET=${BOT_INTERNAL_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: dockerfiles/Dockerfile.dev
    volumes:
      - ./apps/web:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    # NEXT_PUBLIC_API_URL is now auto-detected on the client side
    # Add it here only if you need to override the default behavior
    environment:
      - NEXT_PUBLIC_BOT_USERNAME=${NEXT_PUBLIC_BOT_USERNAME:-KuberanFinBot}
    depends_on:
      - api
    restart: unless-stopped

  bot:
    build:
      context: ./apps/bot
      dockerfile: Dockerfile.dev
    volumes:
      - ./apps/bot:/app
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - API_BASE_URL=http://api:8080
      - BOT_INTERNAL_SECRET=${BOT_INTERNAL_SECRET}
      - LOG_LEVEL=INFO
    depends_on:
      - api
    profiles:
      - bot
    restart: unless-stopped

  oracle:
    build:
      context: ./apps/oracle
      dockerfile: Dockerfile
    environment:
      - KUBERAN_API_URL=http://api:8080
      - PIPELINE_API_KEY=${PIPELINE_API_KEY}
      - COMPUTE_SNAPSHOTS=true
      - LOG_LEVEL=info
    depends_on:
      - api
    profiles:
      - oracle
    restart: "no"

  mcp:
    build:
      context: ./apps/api
      dockerfile: dockerfiles/Dockerfile.dev
    command: go run ./cmd/mcp
    volumes:
      - ./apps/api:/app
      - go-modules:/go/pkg/mod
    ports:
      - "8081:8081"
    environment:
      - ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=kuberan
      - DB_PASSWORD=kuberan
      - DB_NAME=kuberan
      - DB_SSLMODE=disable
      - MCP_PORT=8081
      # The mcp server authenticates callers with Hydra-issued OAuth access
      # tokens, validated offline against Hydra's JWKS. It no longer needs
      # JWT_SECRET (the legacy static MCP token path was removed in Phase 4).
      - HYDRA_ISSUER_URL=${HYDRA_ISSUER_URL:-http://hydra:4444}
      - MCP_RESOURCE_URL=${MCP_RESOURCE_URL:-http://localhost:8081}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # One-shot: create/upgrade Hydra's schema in the dedicated `hydra` database.
  hydra-migrate:
    image: oryd/hydra:v2.2.0
    command: migrate sql -e --yes
    environment:
      - DSN=postgres://kuberan:kuberan@postgres:5432/hydra?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Ory Hydra: OAuth 2.1 Authorization Server for MCP. See plans/015-mcp-oauth-hydra.
  # Public API (:4444) is exposed; the admin API (:4445) MUST stay on the private
  # Docker network and is never published.
  hydra:
    image: oryd/hydra:v2.2.0
    command: serve all --dev --config /etc/config/hydra/hydra.yml
    ports:
      - "4444:4444" # public: authorize/token/discovery/DCR
      # :4445 (admin) intentionally NOT published - private network only.
    volumes:
      - ./ory/hydra/hydra.yml:/etc/config/hydra/hydra.yml:ro
    environment:
      - DSN=postgres://kuberan:kuberan@postgres:5432/hydra?sslmode=disable
      - SECRETS_SYSTEM=${HYDRA_SECRETS_SYSTEM:-dev-only-hydra-system-secret-change-me}
      - URLS_SELF_ISSUER=${HYDRA_ISSUER_URL:-http://localhost:4444}
      - URLS_LOGIN=${HYDRA_LOGIN_URL:-http://localhost:3000/oauth/login}
      - URLS_CONSENT=${HYDRA_CONSENT_URL:-http://localhost:3000/oauth/consent}
    depends_on:
      postgres:
        condition: service_healthy
      hydra-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: kuberan-postgres
    environment:
      POSTGRES_USER: kuberan
      POSTGRES_PASSWORD: kuberan
      POSTGRES_DB: kuberan
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/dev/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuberan"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  go-modules:
  node_modules:
  postgres_data:
    driver: local
