services:
  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "8080:8080"

  mcp:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    # Same image as api; override the entrypoint to run the MCP binary.
    # env_file shares JWT_SECRET with the api so MCP tokens validate here.
    entrypoint: ["/mcp"]
    restart: unless-stopped
    env_file: .env.prod
    environment:
      - MCP_PORT=8081
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "8081:8081"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_BOT_USERNAME: ${NEXT_PUBLIC_BOT_USERNAME:-KuberanFinBot}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"

  oracle:
    build:
      context: ./apps/oracle
      dockerfile: Dockerfile
    env_file: .env.prod
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - KUBERAN_API_URL=http://api:8080
    profiles:
      - oracle
    restart: "no"

  bot:
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
    env_file: .env.prod
    environment:
      - API_BASE_URL=http://api:8080
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - api
    restart: unless-stopped

  backup:
    build:
      context: ./apps/backup
      dockerfile: Dockerfile
    profiles:
      - backup
    env_file: .env.prod
    environment:
      # pg_dump requires a direct connection, not Supavisor's pooler (port 6543).
      # Override to port 5432 for direct access.
      - DB_PORT=5432
      - BACKUP_RETENTION_DAYS=30
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./backups:/backups
    restart: unless-stopped

volumes:
  postgres_data:
