services:
  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      # Receipt attachments (plan 017). The S3 API is reached over the private
      # Docker network; MinIO is NEVER published to the tunnel. Access/secret
      # keys come from .env.prod (scoped service account minted by minio-init).
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=${STORAGE_BUCKET:-kuberan-receipts}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      - STORAGE_USE_PATH_STYLE=true
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "8080:8080"

  mcp:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    # Same image as api; override the entrypoint to run the MCP binary.
    # The MCP server is an OAuth Resource Server: it validates Hydra-issued
    # access tokens offline against Hydra's JWKS. It no longer needs JWT_SECRET
    # (the legacy static MCP token path was removed in plan 15 Phase 4).
    entrypoint: ["/mcp"]
    restart: unless-stopped
    env_file: .env.prod
    environment:
      - MCP_PORT=8081
      # Issuer is reached over the private Docker network; the RS fetches JWKS
      # and validates iss against this URL, so it must equal the public issuer.
      - HYDRA_ISSUER_URL=${HYDRA_ISSUER_URL:?HYDRA_ISSUER_URL is required}
      - MCP_RESOURCE_URL=${MCP_RESOURCE_URL:?MCP_RESOURCE_URL is required}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      hydra:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "8081:8081"

  # One-shot: create/upgrade Hydra's schema in its dedicated `hydra` database.
  # HYDRA_DSN points at the same Postgres/Supabase instance, own database.
  hydra-migrate:
    image: oryd/hydra:v25.4.0
    command: migrate sql -e --yes
    environment:
      - DSN=${HYDRA_DSN:?HYDRA_DSN is required}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"

  # Ory Hydra: OAuth 2.1 Authorization Server for MCP (plan 015-mcp-oauth-hydra).
  # Only the public port (:4444) is published, for the external Cloudflare
  # tunnel to front. Admin (:4445) MUST stay on the private Docker network.
  hydra:
    image: oryd/hydra:v25.4.0
    command: serve all --config /etc/config/hydra/hydra.yml
    environment:
      - DSN=${HYDRA_DSN:?HYDRA_DSN is required}
      - SECRETS_SYSTEM=${HYDRA_SECRETS_SYSTEM:?HYDRA_SECRETS_SYSTEM is required}
      - URLS_SELF_ISSUER=${HYDRA_ISSUER_URL:?HYDRA_ISSUER_URL is required}
      - URLS_LOGIN=${HYDRA_LOGIN_URL:?HYDRA_LOGIN_URL is required}
      - URLS_CONSENT=${HYDRA_CONSENT_URL:?HYDRA_CONSENT_URL is required}
      # The Cloudflare tunnel terminates TLS and forwards plain HTTP, so Hydra
      # must trust X-Forwarded-Proto from the Docker bridge range it arrives on.
      - SERVE_TLS_ALLOW_TERMINATION_FROM=${HYDRA_TLS_TERMINATION_CIDR:-172.16.0.0/12}
      # Advertised as registration_endpoint in the discovery documents; the
      # tunnel routes this exact path to the hardened DCR proxy in apps/api.
      - WEBFINGER_OIDC_DISCOVERY_CLIENT_REGISTRATION_URL=${HYDRA_ISSUER_URL:?HYDRA_ISSUER_URL is required}/oauth2/register
    ports:
      - "4444:4444"
    volumes:
      - ./ory/hydra/hydra.yml:/etc/config/hydra/hydra.yml:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      hydra-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_BOT_USERNAME: ${NEXT_PUBLIC_BOT_USERNAME:-KuberanFinBot}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"

  oracle:
    build:
      context: ./apps/oracle
      dockerfile: Dockerfile
    env_file: .env.prod
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - KUBERAN_API_URL=http://api:8080
    profiles:
      - oracle
    restart: "no"

  bot:
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
    env_file: .env.prod
    environment:
      - API_BASE_URL=http://api:8080
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - api
    restart: unless-stopped

  # Public ingress is an EXTERNAL Cloudflare tunnel (managed outside this repo);
  # it reaches the services via the host-published ports above. Configure the
  # tunnel's public hostnames in the Cloudflare dashboard to map ONLY:
  #   auth.<domain> (path /oauth2/register) -> :8080 (hardened DCR proxy)
  #   auth.<domain> (all other paths)       -> :4444 (OAuth AS: authorize/token/JWKS)
  #   mcp.<domain>  -> :8081  (MCP Resource Server + discovery)
  #   app.<domain>  -> :3000  (login/consent pages + web app)
  #   api.<domain>  -> :8080  (REST API, if exposed)
  # DCR MUST route to the api proxy, not Hydra: Hydra advertises its
  # registration_endpoint as https://auth.<domain>/oauth2/register, and the api
  # container serves that exact path (see cmd/api/main.go) with the Phase 5
  # hardening (public clients, capped scopes, audit/alert). Routing /oauth2/register
  # straight to Hydra would bypass every one of those controls.
  # NEVER map Hydra admin (:4445). Re-verify the ingress after any tunnel change.

  # MinIO: S3-compatible object store for receipt attachments (plan 017 Phase 4).
  # INTERNAL ONLY — neither the S3 API (:9000) nor the console (:9001) is
  # published, so it is unreachable from the Cloudflare tunnel. Only the api
  # and backup services talk to it over the private Docker network.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: wait for MinIO, create the receipts bucket (private), enable
  # versioning (guards against accidental/malicious object deletes and feeds
  # Phase 0's off-host R2 mirror), and mint a scoped service account whose keys
  # the api uses. Idempotent — safe to re-run on every deploy.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        do echo 'waiting for minio...'; sleep 1; done &&
        mc mb --ignore-existing local/"$${STORAGE_BUCKET:-kuberan-receipts}" &&
        mc anonymous set none local/"$${STORAGE_BUCKET:-kuberan-receipts}" &&
        mc version enable local/"$${STORAGE_BUCKET:-kuberan-receipts}" &&
        BUCKET="$${STORAGE_BUCKET:-kuberan-receipts}" &&
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::%s/*"]},{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::%s"]}]}' "$${BUCKET}" "$${BUCKET}" > /tmp/receipts-policy.json &&
        (mc admin user svcacct info local "$${STORAGE_ACCESS_KEY}" >/dev/null 2>&1 &&
        mc admin user svcacct edit --policy /tmp/receipts-policy.json
        local "$${STORAGE_ACCESS_KEY}" ||
        mc admin user svcacct add
        --access-key "$${STORAGE_ACCESS_KEY}"
        --secret-key "$${STORAGE_SECRET_KEY}"
        --policy /tmp/receipts-policy.json
        local "$${MINIO_ROOT_USER}") &&
        POLICY=$$(mc --json admin user svcacct info local "$${STORAGE_ACCESS_KEY}") &&
        case "$$POLICY" in
        *GetObject*) echo 'minio-init: least-privilege service-account policy verified' ;;
        *) echo 'minio-init: ERROR service account is missing its scoped policy (would inherit root)' >&2; exit 1 ;;
        esac
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-kuberan-receipts}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
    restart: "no"

  backup:
    build:
      context: ./apps/backup
      dockerfile: Dockerfile
    profiles:
      - backup
    # Wait for minio-init to finish so the receipts bucket and the scoped
    # service account rclone mirrors with already exist. Without this, a host
    # reboot could fire the backup cron before MinIO is provisioned, failing the
    # receipts sync and spuriously tripping the dead-man's-switch even though the
    # DB dump succeeded.
    depends_on:
      minio-init:
        condition: service_completed_successfully
    env_file: .env.prod
    # Off-host encrypted replication (plans/017 Phase 0): the RCLONE_CONFIG_*,
    # HEALTHCHECK_URL, and RECEIPTS_BUCKET vars are supplied via .env.prod and
    # consumed by backup.sh. With RECEIPTS_BUCKET set (Phase 4), backup.sh mirrors
    # the private MinIO receipts bucket off-host to R2 alongside the DB dump.
    environment:
      # pg_dump requires a direct connection, not Supavisor's pooler (port 6543).
      # Override to port 5432 for direct access.
      - DB_PORT=5432
      - BACKUP_RETENTION_DAYS=30
      - RECEIPTS_BUCKET=${STORAGE_BUCKET:-kuberan-receipts}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./backups:/backups
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
